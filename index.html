<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CTD Worker Hajeri</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div>
      <h1>CTD Worker Hajeri</h1>
      <p>Worker Attendance Management</p>
    </div>
    <button id="exportBtn" class="secondary">Export CSV</button>
  </header>

  <main class="container">
    <section class="card toolbar">
      <div>
        <label>Date</label>
        <input type="date" id="dateInput">
      </div>
      <div class="grow">
        <label>Search Worker</label>
        <input type="text" id="searchInput" placeholder="Search worker name">
      </div>
      <button id="addWorkerBtn" class="primary">+ Add Worker</button>
    </section>

    <section class="stats">
      <div class="stat"><strong id="totalCount">0</strong><span>Total</span></div>
      <div class="stat"><strong id="presentCount">0</strong><span>Present</span></div>
      <div class="stat"><strong id="absentCount">0</strong><span>Absent</span></div>
      <div class="stat"><strong id="halfCount">0</strong><span>Half Day</span></div>
    </section>

    <section class="card">
      <div class="section-title">
        <div>
          <h2>Daily Hajeri</h2>
          <p id="selectedDateLabel"></p>
        </div>
        <button id="allPresentBtn" class="secondary">Mark All Present</button>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Worker Name</th>
              <th>Daily Rate</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="workerTable"></tbody>
        </table>
      </div>
      <div id="emptyState" class="empty">No workers found.</div>
    </section>

    <section class="card">
      <div class="section-title">
        <div>
          <h2>Monthly Summary</h2>
          <p>Attendance summary for the selected month</p>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Worker</th>
              <th>Present</th>
              <th>Half Day</th>
              <th>Absent</th>
              <th>Payable Days</th>
              <th>Estimated Salary</th>
            </tr>
          </thead>
          <tbody id="monthlyTable"></tbody>
        </table>
      </div>
    </section>
  </main>

  <div id="modal" class="modal hidden">
    <div class="modal-box">
      <div class="modal-head">
        <h2 id="modalTitle">Add Worker</h2>
        <button id="closeModal" class="close">×</button>
      </div>

      <label>Worker Name *</label>
      <input id="workerName" type="text" placeholder="Enter worker name">

      <label>Daily Rate (₹)</label>
      <input id="workerRate" type="number" min="0" step="1" placeholder="0">

      <label>Mobile Number</label>
      <input id="workerPhone" type="tel" placeholder="Optional">

      <input id="editWorkerId" type="hidden">

      <div class="modal-actions">
        <button id="cancelBtn" class="secondary">Cancel</button>
        <button id="saveWorkerBtn" class="primary">Save Worker</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
